<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As viagens da Figas</title>
    <link rel="stylesheet" href="styles.css">
    <!-- D3.js and TopoJSON -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body>

    <header>
        <h1>As viagens da Figas</h1>
        <div class="intro-image-container" id="main-photo">
            <span class="placeholder-text">Foto de Destaque</span>
        </div>
        <div class="admin-only" style="margin-top: -2rem; margin-bottom: 2rem;">
            <button id="upload-main-btn" style="background: var(--primary); font-size: 0.9rem; padding: 0.5rem 1rem;">Alterar Foto de Destaque</button>
        </div>
        <p style="color: var(--text-muted); font-size: 1.2rem;">Explorando o mundo, um país de cada vez.</p>
        
        <div id="auth-controls" style="margin-top: 1rem;">
            <button id="login-trigger">Acesso Ana</button>
            <button id="logout-btn" class="admin-only" style="background: var(--glass); color: var(--text-muted);">Sair</button>
        </div>
    </header>

    <main id="map-section">
        <div id="map"></div>
    </main>

    <!-- Login Modal -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn">&times;</button>
            <h2 style="margin-bottom: 2rem;">Acesso Restrito</h2>
            <form id="login-form">
                <input type="email" id="email" placeholder="Email" required value="anafigas17@hotmail.com">
                <input type="password" id="password" placeholder="Palavra-passe" required>
                <button type="submit" style="width: 100%;">Entrar</button>
            </form>
            <p id="login-error" style="color: #ef4444; margin-top: 1rem; display: none;">Credenciais incorretas.</p>
        </div>
    </div>

    <!-- Country Details Modal -->
    <div id="country-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn">&times;</button>
            <h2 id="country-name" style="margin-bottom: 1rem;">Nome do País</h2>
            
            <div id="country-view-only" class="view-mode">
                <p id="country-desc-display" style="line-height: 1.6; margin-bottom: 2rem;"></p>
            </div>

            <div id="country-edit-mode" class="admin-only">
                <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted);">Descrição da Viagem</label>
                <textarea id="country-desc-input" rows="6" placeholder="Escreve aqui as tuas memórias desta viagem..."></textarea>
                
                <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
                    <button id="save-country-data">Guardar Alterações</button>
                    <button id="upload-photo-btn" style="background: var(--accent);">Adicionar Foto</button>
                </div>
            </div>

            <div id="country-photos" class="photo-grid">
                <!-- Photos will be injected here -->
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="modal-overlay" style="background: rgba(0,0,0,0.95);">
        <button class="close-btn" style="font-size: 3rem; top: 2rem; right: 2rem;">&times;</button>
        
        <button id="prev-photo" class="nav-btn" style="left: 2rem;">&#10094;</button>
        <img id="lightbox-img" src="" style="max-width: 90%; max-height: 90vh; object-fit: contain; border-radius: 1rem; box-shadow: 0 0 50px rgba(0,0,0,0.5);">
        <button id="next-photo" class="nav-btn" style="right: 2rem;">&#10095;</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
